[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-decisions"
version = "0.1.0"
description = "Typed, locally-run LLM decisions on Apple Silicon (parallel constrained decoding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pd = "parallel_decisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
