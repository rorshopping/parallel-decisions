[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-decisions"
dynamic = ["version"]
description = "Typed, locally-run LLM decisions with MLX or PyTorch (parallel constrained decoding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mlx", "apple-silicon", "llm", "classification", "calibration", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mlx>=0.22; sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'aarch64')",
    "mlx-lm>=0.21; sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'aarch64')",
]

[project.optional-dependencies]
# Install .[torch] for CUDA/CPU inference; select the CUDA wheel separately if needed.
# The runtime uses Transformers 5's cache API. Bounds are not a tested-version matrix.
torch = ["torch>=2.6", "transformers>=5.17,<6", "accelerate>=1.1"]
dev = ["pytest>=8", "packaging>=23"]
mcp = ["mcp>=1.0"]

[project.urls]
Changelog = "https://github.com/rorshopping/parallel-decisions/blob/main/CHANGELOG.md"
Source = "https://github.com/rorshopping/parallel-decisions"

[project.scripts]
pd = "parallel_decisions.cli:main"

[tool.setuptools.dynamic]
version = { attr = "parallel_decisions.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
